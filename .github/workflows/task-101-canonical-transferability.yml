name: task-101-canonical-transferability

on:
  push:
    branches:
      - codex/101-canonical-transferability-v2
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"

      - name: Sync environment
        run: uv sync

      - name: Run XTAI v4 recovered regressions
        run: |
          uv run pytest -q \
            src/libs/market_data/tests/contract/test_closing_auction_observation_contract.py \
            src/libs/market_data/tests/contract/test_session_open_price_observation_contract.py \
            src/libs/market_data/tests/unit/test_decode_shioaji_stock_kbars.py \
            src/libs/realized_variance/tests/contract/test_sampled_intraday_price_contract.py \
            src/libs/realized_variance/tests/unit/test_build_xtai_sampling_prices.py \
            src/libs/realized_variance/tests/unit/test_calculate_intraday_realized_measures_from_sampled_prices.py \
            src/libs/realized_variance/tests/unit/test_calculate_daily_realized_measures_xtai.py

      - name: Run realized-variance regressions
        run: uv run pytest -q src/libs/realized_variance/tests

      - name: Compile Task 101 S1 runners
        run: |
          uv run python -m py_compile \
            docs/research/experiments/run_task_101_us_canonical_panel.py \
            docs/research/experiments/run_task_101_taiwan_canonical_panel.py \
            docs/research/experiments/run_task_101_merge_canonical_panel.py \
            docs/research/experiments/run_task_101_canonical_transferability.py

      - name: Ruff Task 101 S1 runners and recovered XTAI files
        run: |
          uv run ruff check \
            docs/research/experiments/run_task_101_us_canonical_panel.py \
            docs/research/experiments/run_task_101_taiwan_canonical_panel.py \
            docs/research/experiments/run_task_101_merge_canonical_panel.py \
            docs/research/experiments/run_task_101_canonical_transferability.py \
            src/libs/market_data/services/decode_shioaji_stock_kbars.py \
            src/libs/realized_variance/domain/services/build_xtai_sampling_prices.py \
            src/libs/realized_variance/domain/services/calculate_intraday_realized_measures_from_sampled_prices.py \
            src/libs/realized_variance/domain/services/calculate_daily_realized_measures.py

  us-panel-live:
    if: >-
      contains(github.event.head_commit.message, '[canonical-panel-live]') ||
      contains(github.event.head_commit.message, '[canonical-us-panel]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MARKET_FORECAST_ALPACA_API_KEY_ID: ${{ secrets.MARKET_FORECAST_ALPACA_API_KEY_ID }}
      MARKET_FORECAST_ALPACA_SECRET_KEY: ${{ secrets.MARKET_FORECAST_ALPACA_SECRET_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Restore prior U.S. panel cache
        if: contains(github.event.head_commit.message, '[canonical-us-panel]')
        shell: bash
        run: |
          set -euo pipefail
          target="artifacts/private/provider-captures/task-101-us-canonical-panel"
          mkdir -p "$target"
          gh api             "repos/${GITHUB_REPOSITORY}/actions/artifacts/11150665585/zip"             > /tmp/task101-us-partial.zip
          actual_sha="$(sha256sum /tmp/task101-us-partial.zip | cut -d' ' -f1)"
          test "$actual_sha" = "0c5c01c64dacee1865512b1a78040374a31460c3fc1dd982b9bba16704bb0cfc"
          unzip -q /tmp/task101-us-partial.zip -d "$target"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"

      - name: Sync environment
        run: uv sync

      - name: Verify Alpaca credentials
        shell: bash
        run: |
          test -n "${MARKET_FORECAST_ALPACA_API_KEY_ID:-}"
          test -n "${MARKET_FORECAST_ALPACA_SECRET_KEY:-}"

      - name: Execute U.S. frozen canonical panel
        run: |
          uv run python \
            docs/research/experiments/run_task_101_us_canonical_panel.py

      - name: Upload U.S. canonical panel evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task-101-us-canonical-panel
          path: artifacts/private/provider-captures/task-101-us-canonical-panel
          if-no-files-found: ignore
          retention-days: 30

  taiwan-panel-live:
    if: >-
      contains(github.event.head_commit.message, '[canonical-panel-live]') ||
      contains(github.event.head_commit.message, '[canonical-taiwan-panel]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MARKET_FORECAST_SHIOAJI_API_KEY: ${{ secrets.MARKET_FORECAST_SHIOAJI_API_KEY }}
      MARKET_FORECAST_SHIOAJI_SECRET_KEY: ${{ secrets.MARKET_FORECAST_SHIOAJI_SECRET_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Restore prior Taiwan chunk cache
        if: contains(github.event.head_commit.message, '[canonical-taiwan-panel]')
        shell: bash
        run: |
          set -euo pipefail
          target="artifacts/private/provider-captures/task-101-taiwan-canonical-panel"
          mkdir -p "$target"
          gh api             "repos/${GITHUB_REPOSITORY}/actions/artifacts/11150515509/zip"             > /tmp/task101-taiwan-partial.zip
          actual_sha="$(sha256sum /tmp/task101-taiwan-partial.zip | cut -d' ' -f1)"
          test "$actual_sha" = "362ca769d1478ef1497134b9874703ba3bbdfdc05031e05afe71ce6437592688"
          unzip -q /tmp/task101-taiwan-partial.zip -d "$target"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"

      - name: Sync environment
        run: uv sync

      - name: Install Shioaji runtime
        run: uv pip install "shioaji==1.7.7"

      - name: Verify Shioaji credentials
        shell: bash
        run: |
          test -n "${MARKET_FORECAST_SHIOAJI_API_KEY:-}"
          test -n "${MARKET_FORECAST_SHIOAJI_SECRET_KEY:-}"

      - name: Execute Taiwan frozen canonical panel
        run: |
          uv run python \
            docs/research/experiments/run_task_101_taiwan_canonical_panel.py

      - name: Upload Taiwan canonical panel evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task-101-taiwan-canonical-panel
          path: artifacts/private/provider-captures/task-101-taiwan-canonical-panel
          if-no-files-found: ignore
          retention-days: 30

  merge-panel:
    needs:
      - us-panel-live
      - taiwan-panel-live
    if: >-
      needs.us-panel-live.result == 'success' &&
      needs.taiwan-panel-live.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"

      - name: Sync environment
        run: uv sync

      - name: Restore current-run provider artifacts
        shell: bash
        run: |
          set -euo pipefail
          for name in task-101-us-canonical-panel task-101-taiwan-canonical-panel; do
            artifact_id="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq ".artifacts[] | select(.name==\"$name\") | .id" | head -n1)"
            test -n "$artifact_id"
            zip_path="/tmp/${name}.zip"
            target="artifacts/private/provider-captures/${name}"
            mkdir -p "$target"
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              > "$zip_path"
            unzip -q "$zip_path" -d "$target"
          done

      - name: Merge and validate canonical panel
        run: |
          uv run python \
            docs/research/experiments/run_task_101_merge_canonical_panel.py

      - name: Upload merged canonical panel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task-101-canonical-panel
          path: artifacts/private/provider-captures/task-101-canonical-panel
          retention-days: 30

  merge-replay:
    if: contains(github.event.head_commit.message, '[canonical-panel-merge]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"

      - name: Sync environment
        run: uv sync

      - name: Restore accepted provider artifacts
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY' > /tmp/task101-merge-artifacts.tsv
          import json
          from pathlib import Path

          request = json.loads(
              Path(
                  "docs/research/experiments/"
                  "task-101-canonical-panel-merge-request.json"
              ).read_text(encoding="utf-8")
          )
          for key, target in (
              ("us", "task-101-us-canonical-panel"),
              ("taiwan", "task-101-taiwan-canonical-panel"),
          ):
              item = request[key]
              artifact_id = item.get("artifact_id")
              digest = item.get("artifact_sha256")
              if not isinstance(artifact_id, int):
                  raise SystemExit(f"missing_{key}_artifact_id")
              if not isinstance(digest, str) or len(digest) != 64:
                  raise SystemExit(f"missing_{key}_artifact_sha256")
              print(key, target, artifact_id, digest, sep="\t")
          PY

          while IFS=$'\t' read -r key target artifact_id expected_sha; do
            zip_path="/tmp/task101-${key}.zip"
            out="artifacts/private/provider-captures/${target}"
            rm -rf "$out"
            mkdir -p "$out"
            gh api               "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip"               > "$zip_path"
            actual_sha="$(sha256sum "$zip_path" | cut -d' ' -f1)"
            test "$actual_sha" = "$expected_sha"
            unzip -q "$zip_path" -d "$out"
          done < /tmp/task101-merge-artifacts.tsv

      - name: Merge and validate canonical panel
        run: |
          uv run python             docs/research/experiments/run_task_101_merge_canonical_panel.py

      - name: Upload merged canonical panel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task-101-canonical-panel
          path: artifacts/private/provider-captures/task-101-canonical-panel
          retention-days: 30

  transferability:
    if: contains(github.event.head_commit.message, '[canonical-transfer-live]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"

      - name: Sync environment
        run: uv sync

      - name: Verify transfer execution authorization
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          request = json.loads(
              Path(
                  "docs/research/experiments/"
                  "task-101-transferability-request.json"
              ).read_text(encoding="utf-8")
          )
          if request.get("model_execution_allowed") is not True:
              raise SystemExit("model_execution_not_authorized")
          if request.get("measurement_reselection_allowed") is not False:
              raise SystemExit("measurement_reselection_boundary_broken")
          if request.get("new_model_classes_allowed") is not False:
              raise SystemExit("new_model_class_boundary_broken")
          panel = request.get("canonical_panel", {})
          if not isinstance(panel.get("artifact_id"), int):
              raise SystemExit("missing_canonical_panel_artifact_id")
          digest = panel.get("artifact_sha256")
          if not isinstance(digest, str) or len(digest) != 64:
              raise SystemExit("missing_canonical_panel_artifact_sha256")
          PY

      - name: Restore frozen canonical panel
        shell: bash
        run: |
          set -euo pipefail
          read -r artifact_id expected_sha < <(
            uv run python - <<'PY'
          import json
          from pathlib import Path

          request = json.loads(
              Path(
                  "docs/research/experiments/"
                  "task-101-transferability-request.json"
              ).read_text(encoding="utf-8")
          )
          panel = request["canonical_panel"]
          print(panel["artifact_id"], panel["artifact_sha256"])
          PY
          )
          gh api             "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip"             > /tmp/task101-panel.zip
          actual_sha="$(sha256sum /tmp/task101-panel.zip | cut -d' ' -f1)"
          test "$actual_sha" = "$expected_sha"
          target="artifacts/private/provider-captures/task-101-canonical-panel"
          rm -rf "$target"
          mkdir -p "$target"
          unzip -q /tmp/task101-panel.zip -d "$target"

      - name: Execute frozen canonical transferability study
        run: |
          uv run python             docs/research/experiments/run_task_101_canonical_transferability.py

      - name: Upload transferability evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task-101-canonical-transferability
          path: artifacts/private/provider-captures/task-101-transferability
          retention-days: 30
