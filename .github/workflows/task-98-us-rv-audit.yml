name: task-98-us-rv-audit

on:
  push:
    branches:
      - codex/98-us-rv-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"

      - name: Sync environment
        run: uv sync

      - name: Compile audit runner
        run: |
          uv run python -m py_compile \
            docs/research/provider-acceptance/run_task_98_us_rv_audit.py

      - name: Run market-data and realized-variance regressions
        run: |
          uv run pytest -q \
            src/libs/market_data/tests \
            src/libs/realized_variance/tests

      - name: Ruff
        run: |
          uv run ruff check \
            docs/research/provider-acceptance/run_task_98_us_rv_audit.py

  live-audit:
    if: contains(github.event.head_commit.message, '[us-live-audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MARKET_FORECAST_ALPACA_API_KEY_ID: ${{ secrets.MARKET_FORECAST_ALPACA_API_KEY_ID }}
      MARKET_FORECAST_ALPACA_SECRET_KEY: ${{ secrets.MARKET_FORECAST_ALPACA_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"

      - name: Sync environment
        run: uv sync

      - name: Verify Alpaca credentials
        shell: bash
        run: |
          test -n "${MARKET_FORECAST_ALPACA_API_KEY_ID:-}"
          test -n "${MARKET_FORECAST_ALPACA_SECRET_KEY:-}"

      - name: Execute U.S. 252-session audit
        run: |
          uv run python \
            docs/research/provider-acceptance/run_task_98_us_rv_audit.py

      - name: Upload U.S. audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task-98-us-rv-audit
          path: artifacts/private/provider-captures/task-98-us-rv-audit
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 6
