name: task-79-finmind-live-acceptance

on:
  push:
    branches:
      - codex/79-finmind-live-acceptance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-finmind-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MARKET_FORECAST_FINMIND_TOKEN: ${{ secrets.MARKET_FORECAST_FINMIND_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4

      - name: Verify credential is configured
        shell: bash
        run: test -n "${MARKET_FORECAST_FINMIND_TOKEN:-}"

      - name: Sync environment
        run: uv sync

      - name: Execute bounded FinMind acceptance
        run: uv run python docs/research/provider-acceptance/run_task_79_finmind_live_acceptance.py

      - name: Diagnose FinMind HTTP status
        if: failure()
        shell: bash
        run: |
          uv run python - <<'PY'
          import os
          import httpx

          token = os.environ["MARKET_FORECAST_FINMIND_TOKEN"]
          response = httpx.get(
              "https://api.finmindtrade.com/api/v4/data",
              params={
                  "dataset": "TaiwanStockKBar",
                  "data_id": "2330",
                  "start_date": "2024-07-02",
              },
              headers={"Authorization": f"Bearer {token}"},
              timeout=30.0,
          )
          print(f"FinMind diagnostic HTTP status: {response.status_code}")
          PY

      - name: Upload secret-free acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task-79-finmind-live-acceptance
          path: artifacts/private/provider-captures/task-79
          if-no-files-found: ignore
          retention-days: 14
