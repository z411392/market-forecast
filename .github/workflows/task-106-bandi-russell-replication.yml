name: task-106-bandi-russell-replication

on:
  push:
    branches:
      - codex/106-us-bandi-russell-optimal-sampling
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"

      - name: Sync environment
        run: uv sync

      - name: Compile replication runner
        run: |
          uv run python -m py_compile             docs/research/provider-acceptance/run_task_106_bandi_russell_replication.py

      - name: Lint replication runner
        run: |
          uv run ruff check             docs/research/provider-acceptance/run_task_106_bandi_russell_replication.py

  replay:
    if: contains(github.event.head_commit.message, '[br-replication]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"

      - name: Sync environment
        run: uv sync

      - name: Restore and verify Task 97 and Task 106 artifacts
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/private/provider-captures/task-106-replication-input"
          rm -rf "$root"
          mkdir -p "$root/task97" "$root/task106"

          gh api             "repos/${GITHUB_REPOSITORY}/actions/artifacts/11144780888/zip"             > /tmp/task97.zip
          test "$(sha256sum /tmp/task97.zip | cut -d' ' -f1)" =             "39a419d8aa070c2f3b641c5f93dde638189164bb933a7780615a24c6b7e6c812"
          unzip -q /tmp/task97.zip -d "$root/task97"

          gh api             "repos/${GITHUB_REPOSITORY}/actions/artifacts/11147241072/zip"             > /tmp/task106.zip
          test "$(sha256sum /tmp/task106.zip | cut -d' ' -f1)" =             "2eded721511b2b2700f154e967d754a5c6f2f44eaa1b81ba196f8b9beb53308a"
          unzip -q /tmp/task106.zip -d "$root/task106"

      - name: Replay frozen formula on Task 97 panel
        run: |
          uv run python             docs/research/provider-acceptance/run_task_106_bandi_russell_replication.py

      - name: Upload replication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task-106-us-bandi-russell-replication
          path: artifacts/private/provider-captures/task-106-us-bandi-russell-replication
          retention-days: 30
