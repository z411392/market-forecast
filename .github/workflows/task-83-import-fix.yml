name: task-83-import-fix

on:
  push:
    branches:
      - codex/83-governance-ci-reconciliation

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-task83-imports]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"

      - name: Sync project
        run: uv sync

      - name: Freeze I001 file set
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check --select I001 --output-format concise . > /tmp/i001.txt || true
          cut -d: -f1 /tmp/i001.txt | grep -E '\.py$' | sort -u > /tmp/expected.txt
          test "$(wc -l < /tmp/expected.txt)" -eq 15

      - name: Apply only I001 fixes
        run: uv run ruff check --fix --select I001 .

      - name: Verify exact fix scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only -- '*.py' | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          git diff --check

      - name: Commit deterministic import ordering
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Commander"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          xargs -a /tmp/expected.txt git add --
          git commit -m "task-83: apply deterministic Ruff import ordering"
          git push origin HEAD:codex/83-governance-ci-reconciliation
