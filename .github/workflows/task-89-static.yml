name: task-89-static

on:
  push:
    branches:
      - codex/89-taiwan-rv-measurement-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"

      - name: Sync environment
        run: uv sync

      - name: Compile Task 89 research runners
        run: |
          uv run python -m py_compile             docs/research/provider-acceptance/run_task_89_taiwan_rv_measurement_audit.py             docs/research/provider-acceptance/run_task_89_tick_kbar_diagnostic.py             docs/research/provider-acceptance/run_task_89_session_open_diagnostic.py \
            docs/research/provider-acceptance/run_task_89_empty_bucket_diagnostic.py

      - name: Verify Task 86 v3 upstream
        run: |
          uv run pytest -q             src/libs/market_data/tests/contract/test_session_open_price_observation_contract.py             src/libs/realized_variance/tests/contract/test_sampled_intraday_price_contract.py             src/libs/market_data/tests/unit/test_decode_shioaji_stock_kbars.py             src/libs/realized_variance/tests/unit/test_build_xtai_sampling_prices.py             src/libs/realized_variance/tests/unit/test_calculate_intraday_realized_measures_from_sampled_prices.py             src/libs/realized_variance/tests/unit/test_calculate_daily_realized_measures_xtai.py

      - name: Run market-data and RV regressions
        run: uv run pytest -q src/libs/market_data/tests src/libs/realized_variance/tests

      - name: Lint synced v3 production and Task 89 runners
        run: |
          uv run ruff check             src/libs/market_data/dtos/session_open_price_observation.py             src/libs/market_data/services/decode_shioaji_stock_kbars.py             src/libs/realized_variance/constants/xtai_realized_variance_algorithm_version.py             src/libs/realized_variance/dtos/sampled_intraday_price.py             src/libs/realized_variance/domain/services/build_xtai_sampling_prices.py             src/libs/realized_variance/domain/services/calculate_intraday_realized_measures_from_sampled_prices.py             docs/research/provider-acceptance/run_task_89_taiwan_rv_measurement_audit.py             docs/research/provider-acceptance/run_task_89_tick_kbar_diagnostic.py             docs/research/provider-acceptance/run_task_89_session_open_diagnostic.py \
            docs/research/provider-acceptance/run_task_89_empty_bucket_diagnostic.py

      - name: Typecheck synced v3 production
        run: |
          uv run pyright             src/libs/market_data/dtos/session_open_price_observation.py             src/libs/market_data/services/decode_shioaji_stock_kbars.py             src/libs/realized_variance/constants/xtai_realized_variance_algorithm_version.py             src/libs/realized_variance/dtos/sampled_intraday_price.py             src/libs/realized_variance/domain/services/build_xtai_sampling_prices.py             src/libs/realized_variance/domain/services/calculate_intraday_realized_measures_from_sampled_prices.py
