name: task-83-format-preview

on:
  push:
    branches:
      - codex/83-governance-ci-reconciliation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"

      - name: Sync project
        run: uv sync

      - name: Format repository
        run: uv run ruff format .

      - name: Package formatted files
        shell: bash
        run: |
          git diff --name-only -- '*.py' > /tmp/formatted-files.txt
          test -s /tmp/formatted-files.txt
          tar -czf /tmp/task-83-formatted.tar.gz -T /tmp/formatted-files.txt
          cp /tmp/formatted-files.txt /tmp/formatted-files-manifest.txt

      - name: Upload format preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task-83-format-preview
          path: |
            /tmp/task-83-formatted.tar.gz
            /tmp/formatted-files-manifest.txt
          retention-days: 3
