name: task-90-rk-s4f-collection-plan

on:
  push:
    branches:
      - codex/90-taiwan-rk-feasibility
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s4f:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"

      - name: Sync environment
        run: uv sync

      - name: Run S4f frozen tests
        run: |
          uv run pytest -q \
            src/libs/market_data/tests/unit/test_build_tick_day_collection_plan.py \
            src/libs/market_data/tests/unit/test_partition_tick_day_collection_plan.py

      - name: Run S4d regressions
        run: |
          uv run pytest -q \
            src/libs/market_data/tests/contract/test_tick_batch_collection_contract.py \
            src/libs/market_data/tests/unit/test_shioaji_tick_adapters.py \
            src/libs/market_data/tests/unit/test_collect_tick_day_evidence_batch.py

      - name: Generate deterministic S4f plan artifact
        run: |
          uv run python \
            docs/research/provider-acceptance/run_task_90_s4f_collection_plan.py

      - name: Lint S4f production and runner
        run: |
          uv run ruff check \
            src/libs/market_data/services/build_tick_day_collection_plan.py \
            src/libs/market_data/services/partition_tick_day_collection_plan.py \
            docs/research/provider-acceptance/run_task_90_s4f_collection_plan.py

      - name: Typecheck S4f production
        run: |
          uv run pyright \
            src/libs/market_data/services/build_tick_day_collection_plan.py \
            src/libs/market_data/services/partition_tick_day_collection_plan.py

      - name: Upload S4f plan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task-90-s4f-collection-plan
          path: artifacts/private/provider-captures/task-90-s4f-collection-plan/plan.json
          retention-days: 14
