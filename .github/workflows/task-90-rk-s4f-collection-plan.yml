name: task-90-rk-s4f-collection-plan

on:
  push:
    branches:
      - codex/90-taiwan-rk-feasibility
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s4f:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"

      - name: Sync environment
        run: uv sync

      - name: Run S4f frozen tests
        run: |
          uv run pytest -q \
            src/libs/market_data/tests/unit/test_build_tick_day_collection_plan.py \
            src/libs/market_data/tests/unit/test_partition_tick_day_collection_plan.py

      - name: Run S4d regressions
        if: always()
        run: |
          uv run pytest -q \
            src/libs/market_data/tests/contract/test_tick_batch_collection_contract.py \
            src/libs/market_data/tests/unit/test_shioaji_tick_adapters.py \
            src/libs/market_data/tests/unit/test_collect_tick_day_evidence_batch.py

      - name: Lint S4f production when present
        if: always()
        shell: bash
        run: |
          files=(
            src/libs/market_data/services/build_tick_day_collection_plan.py
            src/libs/market_data/services/partition_tick_day_collection_plan.py
          )
          existing=()
          for file in "${files[@]}"; do
            test -f "$file" && existing+=("$file")
          done
          if (("${#existing[@]}" > 0)); then
            uv run ruff check "${existing[@]}"
          fi

      - name: Typecheck S4f production when present
        if: always()
        shell: bash
        run: |
          files=(
            src/libs/market_data/services/build_tick_day_collection_plan.py
            src/libs/market_data/services/partition_tick_day_collection_plan.py
          )
          existing=()
          for file in "${files[@]}"; do
            test -f "$file" && existing+=("$file")
          done
          if (("${#existing[@]}" > 0)); then
            uv run pyright "${existing[@]}"
          fi
