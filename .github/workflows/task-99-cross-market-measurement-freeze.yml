name: task-99-cross-market-measurement-freeze

on:
  push:
    branches:
      - codex/99-cross-market-measurement-freeze
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"

      - name: Sync environment
        run: uv sync

      - name: Verify frozen measurement manifest
        run: |
          uv run python \
            docs/research/provider-acceptance/verify_cross_market_rv_measurement_target_manifest_v1.py

      - name: Run target-builder regressions
        run: |
          uv run pytest -q \
            src/libs/realized_variance/tests/unit/test_build_future_variance_targets.py

      - name: Ruff
        run: |
          uv run ruff check \
            docs/research/provider-acceptance/verify_cross_market_rv_measurement_target_manifest_v1.py
