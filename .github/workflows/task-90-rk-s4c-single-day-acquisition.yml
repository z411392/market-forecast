name: task-90-rk-s4c-single-day-acquisition

on:
  push:
    branches:
      - codex/90-taiwan-rk-feasibility
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s4c:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"

      - name: Sync environment
        run: uv sync

      - name: Run S4c frozen tests
        run: |
          uv run pytest -q             src/libs/market_data/tests/contract/test_tick_day_acquisition_contract.py             src/libs/market_data/tests/unit/test_decode_shioaji_historical_ticks.py             src/libs/market_data/tests/unit/test_acquire_and_persist_tick_day_evidence.py

      - name: Run S4b regressions
        run: |
          uv run pytest -q             src/libs/market_data/tests/contract/test_tick_day_evidence_contract.py             src/libs/market_data/tests/unit/test_build_tick_day_evidence.py             src/libs/market_data/tests/unit/test_filesystem_tick_day_evidence_adapter.py

      - name: Lint S4c production when present
        if: always()
        shell: bash
        run: |
          files=(
            src/libs/market_data/dtos/provider_traffic_usage.py
            src/libs/market_data/ports/fetch_historical_tick_payload_port.py
            src/libs/market_data/ports/read_provider_traffic_usage_port.py
            src/libs/market_data/ports/tick_day_evidence_store_port.py
            src/libs/market_data/services/decode_shioaji_historical_ticks.py
            src/libs/market_data/services/acquire_and_persist_tick_day_evidence.py
            src/libs/market_data/adapters/driven/filesystem_tick_day_evidence_adapter.py
          )
          existing=()
          for file in "${files[@]}"; do
            test -f "$file" && existing+=("$file")
          done
          if (("${#existing[@]}" > 0)); then
            uv run ruff check "${existing[@]}"
          fi

      - name: Typecheck S4c production when present
        if: always()
        shell: bash
        run: |
          files=(
            src/libs/market_data/dtos/provider_traffic_usage.py
            src/libs/market_data/ports/fetch_historical_tick_payload_port.py
            src/libs/market_data/ports/read_provider_traffic_usage_port.py
            src/libs/market_data/ports/tick_day_evidence_store_port.py
            src/libs/market_data/services/decode_shioaji_historical_ticks.py
            src/libs/market_data/services/acquire_and_persist_tick_day_evidence.py
            src/libs/market_data/adapters/driven/filesystem_tick_day_evidence_adapter.py
          )
          existing=()
          for file in "${files[@]}"; do
            test -f "$file" && existing+=("$file")
          done
          if (("${#existing[@]}" > 0)); then
            uv run pyright "${existing[@]}"
          fi
