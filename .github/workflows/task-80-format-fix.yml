name: task-80-format-fix

on:
  push:
    branches:
      - codex/80-corporate-action-contract-recovery-v2

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-task80-format]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"

      - name: Sync project
        run: uv sync

      - name: Apply deterministic Ruff formatting
        run: |
          uv run ruff format             src/libs/market_data/tests/contract/test_corporate_action_contract.py

      - name: Verify exact formatted file set
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --name-only -- '*.py')"
          test "$actual" = "src/libs/market_data/tests/contract/test_corporate_action_contract.py"

      - name: Commit exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Commander"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/libs/market_data/tests/contract/test_corporate_action_contract.py
          git diff --cached --check
          git commit -m "task-80: apply deterministic Ruff 0.8.6 formatting"
          git push origin HEAD:codex/80-corporate-action-contract-recovery-v2
