name: task-95-alpaca-us-live-acceptance

on:
  push:
    branches:
      - codex/95-alpaca-us-live-acceptance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-presence:
    if: contains(github.event.head_commit.message, '[alpaca-secret-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MARKET_FORECAST_ALPACA_API_KEY_ID: ${{ secrets.MARKET_FORECAST_ALPACA_API_KEY_ID }}
      MARKET_FORECAST_ALPACA_SECRET_KEY: ${{ secrets.MARKET_FORECAST_ALPACA_SECRET_KEY }}
    steps:
      - name: Verify Alpaca credential presence only
        shell: bash
        run: |
          test -n "${MARKET_FORECAST_ALPACA_API_KEY_ID:-}"
          test -n "${MARKET_FORECAST_ALPACA_SECRET_KEY:-}"

  sip-smoke:
    if: contains(github.event.head_commit.message, '[alpaca-sip-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MARKET_FORECAST_ALPACA_API_KEY_ID: ${{ secrets.MARKET_FORECAST_ALPACA_API_KEY_ID }}
      MARKET_FORECAST_ALPACA_SECRET_KEY: ${{ secrets.MARKET_FORECAST_ALPACA_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"

      - name: Sync environment
        run: uv sync

      - name: Execute one historical SIP smoke request
        run: |
          uv run python \
            docs/research/provider-acceptance/run_task_95_alpaca_historical_sip_smoke.py

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task-95-alpaca-historical-sip-smoke
          path: artifacts/private/provider-captures/task-95-alpaca-historical-sip-smoke
          if-no-files-found: ignore
          retention-days: 30

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"

      - name: Sync environment
        run: uv sync

      - name: Run Task 95 Alpaca oracles
        run: |
          uv run pytest -q \
            src/libs/market_data/tests/unit/test_build_alpaca_historical_bars_request.py \
            src/libs/market_data/tests/unit/test_decode_alpaca_stock_bars.py \
            src/libs/market_data/tests/unit/test_httpx_alpaca_provider_raw_response_adapter.py \
            src/libs/market_data/tests/unit/test_build_alpaca_provider_capture_acceptance.py
