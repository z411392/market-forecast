name: task-90-realized-kernel-bandwidth

on:
  push:
    branches:
      - codex/90-taiwan-rk-feasibility
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task-90-s3c:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"

      - name: Sync environment
        run: uv sync

      - name: Run Task 90 sparse-RV and bandwidth oracles
        run: |
          uv run pytest -q \
            src/libs/realized_variance/tests/unit/test_estimate_sparse_realized_variance.py \
            src/libs/realized_variance/tests/unit/test_realized_kernel_bandwidth.py
