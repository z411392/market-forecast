name: task-90-rk-s3d-kernel

on:
  push:
    branches:
      - codex/90-taiwan-rk-feasibility
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s3d-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"

      - name: Sync environment
        run: uv sync

      - name: Run frozen S3d kernel oracle
        run: |
          uv run pytest -q             src/libs/realized_variance/tests/unit/test_calculate_parzen_realized_kernel.py

      - name: Lint S3d production file
        run: |
          uv run ruff check             src/libs/realized_variance/domain/services/calculate_parzen_realized_kernel.py

      - name: Typecheck S3d production file
        run: |
          uv run pyright             src/libs/realized_variance/domain/services/calculate_parzen_realized_kernel.py
