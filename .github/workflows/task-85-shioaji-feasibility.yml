name: task-85-shioaji-feasibility

on:
  push:
    branches:
      - codex/85-shioaji-feasibility
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shioaji-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MARKET_FORECAST_SHIOAJI_API_KEY: ${{ secrets.MARKET_FORECAST_SHIOAJI_API_KEY }}
      MARKET_FORECAST_SHIOAJI_SECRET_KEY: ${{ secrets.MARKET_FORECAST_SHIOAJI_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"

      - name: Verify Shioaji credentials are configured
        shell: bash
        run: |
          test -n "${MARKET_FORECAST_SHIOAJI_API_KEY:-}"
          test -n "${MARKET_FORECAST_SHIOAJI_SECRET_KEY:-}"

      - name: Execute read-only Shioaji feasibility
        run: uv run --with "shioaji==1.7.6" python docs/research/provider-acceptance/run_task_85_shioaji_feasibility.py

      - name: Upload Shioaji feasibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task-85-shioaji-feasibility
          path: artifacts/private/provider-captures/task-85-shioaji
          if-no-files-found: ignore
          retention-days: 14
