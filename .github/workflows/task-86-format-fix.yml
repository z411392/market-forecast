name: task-86-format-fix

on:
  push:
    branches:
      - codex/86-xtai-closing-auction-rv-v2

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-task86-format]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"

      - name: Sync project
        run: uv sync

      - name: Apply deterministic Ruff formatting and import fixes
        run: |
          uv run ruff format             docs/research/provider-acceptance/run_task_86_xtai_rv_replay.py             src/libs/market_data/services/decode_shioaji_stock_kbars.py             src/libs/market_data/tests/unit/test_decode_shioaji_stock_kbars.py             src/libs/realized_variance/domain/services/build_xtai_sampling_prices.py             src/libs/realized_variance/domain/services/calculate_daily_realized_measures.py             src/libs/realized_variance/domain/services/calculate_intraday_realized_measures_from_sampled_prices.py             src/libs/realized_variance/tests/unit/test_build_xtai_sampling_prices.py             src/libs/realized_variance/tests/unit/test_calculate_intraday_realized_measures_from_sampled_prices.py
          uv run ruff check --fix             docs/research/provider-acceptance/run_task_86_xtai_rv_replay.py             src/libs/market_data/services/decode_shioaji_stock_kbars.py             src/libs/market_data/tests/unit/test_decode_shioaji_stock_kbars.py             src/libs/realized_variance/domain/services/build_xtai_sampling_prices.py             src/libs/realized_variance/domain/services/calculate_daily_realized_measures.py             src/libs/realized_variance/domain/services/calculate_intraday_realized_measures_from_sampled_prices.py             src/libs/realized_variance/tests/unit/test_build_xtai_sampling_prices.py             src/libs/realized_variance/tests/unit/test_calculate_intraday_realized_measures_from_sampled_prices.py

      - name: Verify changed file allowlist
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/allowed.txt <<'EOF'
          docs/research/provider-acceptance/run_task_86_xtai_rv_replay.py
          src/libs/market_data/services/decode_shioaji_stock_kbars.py
          src/libs/market_data/tests/unit/test_decode_shioaji_stock_kbars.py
          src/libs/realized_variance/domain/services/build_xtai_sampling_prices.py
          src/libs/realized_variance/domain/services/calculate_daily_realized_measures.py
          src/libs/realized_variance/domain/services/calculate_intraday_realized_measures_from_sampled_prices.py
          src/libs/realized_variance/tests/unit/test_build_xtai_sampling_prices.py
          src/libs/realized_variance/tests/unit/test_calculate_intraday_realized_measures_from_sampled_prices.py
          EOF
          sed -i 's/^          //' /tmp/allowed.txt
          git diff --name-only -- '*.py' | sort > /tmp/actual.txt
          test -s /tmp/actual.txt
          comm -23 /tmp/actual.txt <(sort /tmp/allowed.txt) | (! grep .)

      - name: Commit exact mechanical output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Commander"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.py'
          git diff --cached --check
          git commit -m "task-86: apply deterministic Ruff 0.8.6 formatting"
          git push origin HEAD:codex/86-xtai-closing-auction-rv-v2
