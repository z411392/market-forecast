name: task-90-rk-s4d-batch-acquisition

on:
  push:
    branches:
      - codex/90-taiwan-rk-feasibility
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s4d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"

      - name: Sync environment
        run: uv sync

      - name: Run S4d frozen tests
        run: |
          uv run pytest -q             src/libs/market_data/tests/contract/test_tick_batch_collection_contract.py             src/libs/market_data/tests/unit/test_shioaji_tick_adapters.py             src/libs/market_data/tests/unit/test_collect_tick_day_evidence_batch.py

      - name: Run S4c regressions
        if: always()
        run: |
          uv run pytest -q             src/libs/market_data/tests/contract/test_tick_day_acquisition_contract.py             src/libs/market_data/tests/unit/test_decode_shioaji_historical_ticks.py             src/libs/market_data/tests/unit/test_acquire_and_persist_tick_day_evidence.py

      - name: Run S4b regressions
        if: always()
        run: |
          uv run pytest -q             src/libs/market_data/tests/contract/test_tick_day_evidence_contract.py             src/libs/market_data/tests/unit/test_build_tick_day_evidence.py             src/libs/market_data/tests/unit/test_filesystem_tick_day_evidence_adapter.py

      - name: Lint S4d production when present
        if: always()
        shell: bash
        run: |
          files=(
            src/libs/market_data/dtos/tick_day_collection_item.py
            src/libs/market_data/dtos/tick_batch_collection_summary.py
            src/libs/market_data/adapters/driven/shioaji_historical_tick_payload_adapter.py
            src/libs/market_data/adapters/driven/shioaji_provider_traffic_usage_adapter.py
            src/libs/market_data/services/collect_tick_day_evidence_batch.py
          )
          existing=()
          for file in "${files[@]}"; do
            test -f "$file" && existing+=("$file")
          done
          if (("${#existing[@]}" > 0)); then
            uv run ruff check "${existing[@]}"
          fi

      - name: Typecheck S4d production when present
        if: always()
        shell: bash
        run: |
          files=(
            src/libs/market_data/dtos/tick_day_collection_item.py
            src/libs/market_data/dtos/tick_batch_collection_summary.py
            src/libs/market_data/adapters/driven/shioaji_historical_tick_payload_adapter.py
            src/libs/market_data/adapters/driven/shioaji_provider_traffic_usage_adapter.py
            src/libs/market_data/services/collect_tick_day_evidence_batch.py
          )
          existing=()
          for file in "${files[@]}"; do
            test -f "$file" && existing+=("$file")
          done
          if (("${#existing[@]}" > 0)); then
            uv run pyright "${existing[@]}"
          fi
