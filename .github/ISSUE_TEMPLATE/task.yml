name: Task
description: task 工作項；遵守 specs/README.md
labels: ["type/task"]
body:
  - type: textarea
    id: work
    attributes:
      label: "實作責任、輸入、輸出與單一 owner"
    validations:
      required: true
  - type: textarea
    id: parent
    attributes:
      label: "Parent Story 與 spec／plan 引用（另設定原生 parent）"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "Exact writable／frozen paths、依賴、完整派工 prompt 與授權副作用"
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: "AC 引用、有限步驟、測試命令、預期結果及停止條件"
    validations:
      required: true
  - type: textarea
    id: roadmap_phase
    attributes:
      label: "Roadmap phase"
      description: "產品 P0–P4；不填工程 Analysis／Design／Implement 階段。"
    validations:
      required: true
  - type: textarea
    id: roadmap_exits
    attributes:
      label: "Roadmap exit IDs"
      description: "精確 ID 與 owning Story progress；支援工作填 None（僅支援），跨階段逐 Subtask 映射。"
    validations:
      required: true
  - type: dropdown
    id: roadmap_effect
    attributes:
      label: "Roadmap effect"
      description: "貢獻分類不代表 Exit 已成立；跨 Subtask 差異在驗收映射逐項列明。"
      options:
        - ADVANCES
        - PROVES
        - SUPPORT_ONLY
        - FUTURE_PHASE
    validations:
      required: true
  - type: textarea
    id: acceptance_mapping
    attributes:
      label: "SC／AC → Task／Subtask GWT → Exit／effect → 必要證據"
      description: "列正例、反例、禁止副作用、oracle／commands／expected results；Epic 連到各 Story 唯一 AC，不重抄產品規則。"
    validations:
      required: true
  - type: textarea
    id: evidence_verdict
    attributes:
      label: "Exit evidence／verdict 與 first blocking exit"
      description: "引用 owning Story progress：revision、命令／exit／日期、正反結果、獨立 reviewer；NOT_RUN 的 exit 填 N/A。無必要證據不能 PROVEN。Blocker 列 concrete Task／AC／dependency、受阻 Task／Exit、owner、clear condition。"
    validations:
      required: true
  - type: textarea
    id: dispatch_contract
    attributes:
      label: "目前完整 prompt／Task-local readiness／交付邊界"
      description: "最新完整 prompt 只放 Issue 頂部；依 specs/README 與 .claude/rules/15-execution-strategy.md#task-local-readiness，列單一 writer、integration owner、Task branch、逐 Subtask commit、exact writable／frozen、授權、有限 commands／Done／停止條件。不得以無關工作或 generic global gate 阻擋。"
    validations:
      required: true
